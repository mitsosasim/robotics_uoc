<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Robotics localization replay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101823;color:#dce5ef;font:15px system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:27px;letter-spacing:-.6px;margin:3px 0 5px}p{margin:0;color:#a6b6c7}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;color:#82b6dd}select,button{background:#213246;color:#ecf3fa;border:1px solid #405770;border-radius:5px;padding:9px 12px;font:inherit;cursor:pointer}.badge{font-size:12px;color:#9ec9e8;border:1px solid #304d68;border-radius:20px;padding:7px 12px}.workspace{background:#152231;border:1px solid #2b4055;border-radius:8px;overflow:hidden}.toolbar{display:flex;gap:18px;align-items:center;padding:12px 18px;border-bottom:1px solid #2b4055;color:#a7b9ca;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.drawing{padding:10px 10px 0}canvas{display:block;width:100%;height:auto}.controls{display:flex;align-items:center;gap:16px;padding:14px 18px;background:#192a3c}input{flex:1;accent-color:#67d6b0}#clock{font-variant-numeric:tabular-nums;min-width:100px}footer{margin-top:12px;display:flex;justify-content:space-between;color:#92a6ba;font-size:12px}a{color:#9cccef}.error{color:#fbc681}
</style></head><body><main class="app"><header><div><div class="eyebrow">Robotics · State estimation</div><h1 id="title">Loading replay</h1><p id="subtitle"></p></div><div><div class="badge">Python / NumPy simulation</div></div></header>
<section class="workspace"><div class="toolbar"><select id="assignment"><option value="1">01 · Kalman filter</option><option value="2">02 · Extended Kalman filter</option><option value="3">03 · Particle filter</option></select><span><i class="dot" style="background:#66b7ff"></i>True robot</span><span><i class="dot" style="background:#67d6b0"></i>Estimate</span><span id="sensorLegend"><i class="dot" style="background:#efb96b"></i>GPS samples</span></div>
<div class="drawing"><canvas id="scene" width="1200" height="630"></canvas></div><div class="controls"><button id="play">Play</button><input id="frame" type="range" min="0" max="0" value="0" aria-label="Replay time"><span id="clock"></span><button id="restart">Restart</button></div></section>
<footer><span id="details"></span><span>Recorded algorithm output · synthetic sensors · no ROS / Gazebo</span></footer></main>
<script>
const canvas=document.querySelector('#scene'), ctx=canvas.getContext('2d');
const number=new URLSearchParams(location.search).get('assignment')||'1';
const selector=document.querySelector('#assignment'), slider=document.querySelector('#frame');
selector.value=number;selector.onchange=()=>location.search='?assignment='+selector.value;
let data, current=0, playing=false;
const colors={truth:'#66b7ff',estimate:'#67d6b0',gps:'#efb96b',base:'#8e9eaf',grid:'#2c4054',text:'#dce5ef',muted:'#9eb1c5'};
function text(s,x,y,size=14,color=colors.text){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(s,x,y)}
function line(points,transform,color,width=2){if(!points.length)return;ctx.beginPath();points.forEach((p,i)=>{let q=transform(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function draw(){
 const f=data.frames[current], n=f.index+1, pf=number==='3';
 ctx.clearRect(0,0,1200,630);ctx.fillStyle='#152231';ctx.fillRect(0,0,1200,630);
 const area={x:63,y:48,w:725,h:515};let [xmin,xmax,ymin,ymax]=data.bounds;
 // Equal world-coordinate scale for robot/map geometry.
 const scale=Math.min(area.w/(xmax-xmin),area.h/(ymax-ymin));
 const w=(xmax-xmin)*scale,h=(ymax-ymin)*scale;
 const x0=area.x+(area.w-w)/2, y0=area.y+(area.h-h)/2;
 const to=p=>[x0+(p[0]-xmin)*scale,y0+h-(p[1]-ymin)*scale];
 text(pf?'Height-map localization':'Robot trajectory',35,25,16);
 ctx.fillStyle='#101b28';ctx.fillRect(area.x,area.y,area.w,area.h);
 ctx.save();ctx.beginPath();ctx.rect(area.x,area.y,area.w,area.h);ctx.clip();
 if(pf){
  const surface=data.height_map;
  for(let j=0;j<surface.length;j++)for(let i=0;i<surface[j].length;i++)if(surface[j][i]!==0){
    ctx.fillStyle=surface[j][i]>0?`rgba(128,173,205,${.2+.55*Math.min(1,surface[j][i])})`:'#44516a';
    let p=to([i*.1,(j+1)*.1]);ctx.fillRect(p[0],p[1],scale*.1+1,scale*.1+1);
  }
 }
 ctx.lineWidth=1;ctx.strokeStyle=colors.grid;
 const tick=pf?1:(xmax-xmin>10?2:1);
 for(let x=Math.ceil(xmin);x<=xmax;x+=tick){const a=to([x,ymin]),b=to([x,ymax]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
 for(let y=Math.ceil(ymin);y<=ymax;y+=tick){const a=to([xmin,y]),b=to([xmax,y]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
 if(!pf){ctx.fillStyle='#efb96b88';for(const p of data.measurements.slice(0,n)){let q=to(p);ctx.beginPath();ctx.arc(...q,2.2,0,Math.PI*2);ctx.fill()}}
 line(data.truth.slice(0,n),to,colors.truth,2);
 if(data.baseline.length)line(data.baseline.slice(0,n),to,colors.base,1.5);
 line(data.estimate.slice(0,n),to,colors.estimate,2.4);
 if(pf){ctx.fillStyle='#efb96bb0';for(const p of f.particles){let q=to(p);ctx.fillRect(q[0]-1,q[1]-1,2.5,2.5)}}
 // 95% planar covariance contour, computed from the recorded covariance.
 const P=f.covariance,a=P[0][0],b=P[0][1],d=P[1][1],angle=.5*Math.atan2(2*b,a-d);
 const root=Math.sqrt((a-d)**2+4*b*b), l1=Math.max(0,(a+d+root)/2),l2=Math.max(0,(a+d-root)/2);
 const contour=[];for(let i=0;i<=80;i++){let t=i/80*2*Math.PI,u=Math.sqrt(5.991*l1)*Math.cos(t),v=Math.sqrt(5.991*l2)*Math.sin(t);contour.push([f.position[0]+u*Math.cos(angle)-v*Math.sin(angle),f.position[1]+u*Math.sin(angle)+v*Math.cos(angle)])}
 line(contour,to,colors.estimate,1.2);
 let robot=to(data.truth[f.index]);ctx.save();ctx.translate(...robot);ctx.rotate(-f.heading);
 ctx.strokeStyle=colors.truth;ctx.fillStyle='#152231';ctx.lineWidth=2.4;
 if(pf){for(const dx of [-8,8])for(const dy of [-8,8]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dx,dy);ctx.stroke();ctx.beginPath();ctx.arc(dx,dy,4.5,0,Math.PI*2);ctx.fill();ctx.stroke()}}
 else{ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(2,-5);ctx.lineTo(14,0);ctx.lineTo(2,5);ctx.stroke()}
 ctx.restore();const est=to(f.position);ctx.fillStyle=colors.estimate;ctx.beginPath();ctx.arc(...est,4,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.strokeStyle=colors.grid;ctx.strokeRect(area.x,area.y,area.w,area.h);
 for(let x=Math.ceil(xmin);x<=xmax;x+=tick){let q=to([x,ymin]);text(x.toFixed(0),q[0]-4,y0+h+20,11,colors.muted)}
 for(let y=Math.ceil(ymin);y<=ymax;y+=tick){let q=to([xmin,y]);text(y.toFixed(0),x0-25,q[1]+4,11,colors.muted)}
 text('x [m]',area.x+area.w/2,612,12,colors.muted);text('y [m]',15,area.y+15,12,colors.muted);
 text('Position error [m]',840,25,16);
 const g={x:850,y:55,w:310,h:185}, maximum=Math.max(pf?1:.3,...data.errors)*1.08;
 ctx.fillStyle='#101b28';ctx.fillRect(g.x,g.y,g.w,g.h);ctx.strokeStyle=colors.grid;ctx.strokeRect(g.x,g.y,g.w,g.h);
 const total=data.times.at(-1);const gt=p=>[g.x+p[0]/total*g.w,g.y+g.h-p[1]/maximum*g.h];
 for(let i=0;i<=4;i++){let y=g.y+g.h-i*g.h/4;ctx.beginPath();ctx.moveTo(g.x,y);ctx.lineTo(g.x+g.w,y);ctx.stroke();text((maximum*i/4).toFixed(maximum<1?2:1),g.x-28,y+4,11,colors.muted)}
 line(data.errors.slice(0,n).map((e,i)=>[data.times[i],e]),gt,colors.estimate,2);
 text('0',g.x,g.y+g.h+18,11,colors.muted);text(total.toFixed(0)+' s',g.x+g.w-25,g.y+g.h+18,11,colors.muted);
 let y=305;text('RECORDED RUN',840,y,11,colors.muted);y+=34;
 const metrics=Object.entries(data.metrics);
 for(const [key,val] of metrics){let label=key.replaceAll('_',' ').replace('rmse m','RMSE [m]').replace('error m','error [m]');text(label,840,y,13,colors.muted);text(Number.isInteger(val)?val.toLocaleString():val.toFixed(3),1080,y,21);y+=42;}
 text('Current error',840,y+10,13,colors.muted);text(data.errors[f.index].toFixed(3)+' m',1040,y+10,21,colors.estimate);
 text(pf?'Filled cells: supplied measurement surface':'Grey: dead reckoning · ellipse: 95% covariance',840,570,12,colors.muted);
 if(pf)text('Cloud: 1,200 of 12,000 particles shown',840,590,12,colors.muted);
 document.querySelector('#clock').textContent=f.time.toFixed(1)+' / '+total.toFixed(1)+' s';slider.value=current;
 document.querySelector('#details').textContent='Seed '+data.seed+' · '+data.truth.length+' steps · '+data.dt.toFixed(1)+' s step';
 window.replayReady=true;
}
slider.oninput=()=>{current=+slider.value;draw()};document.querySelector('#restart').onclick=()=>{current=0;draw()};
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing&&current===data.frames.length-1)current=0};
setInterval(()=>{if(playing&&data){current++;if(current>=data.frames.length){current=data.frames.length-1;playing=false;document.querySelector('#play').textContent='Play'}draw()}},150);
fetch('../build/assignment'+number+'.json').then(r=>{if(!r.ok)throw Error('Run tools/simulate.py first');return r.json()}).then(x=>{data=x;document.querySelector('#title').textContent=x.title;document.querySelector('#subtitle').textContent=x.subtitle;document.querySelector('#sensorLegend').innerHTML='<i class="dot" style="background:#efb96b"></i>'+(number==='3'?'Particle cloud':'GPS samples');slider.max=x.frames.length-1;current=x.frames.length-1;draw()}).catch(e=>{document.querySelector('#title').textContent=e.message;document.querySelector('#title').className='error'});
</script></body></html>
